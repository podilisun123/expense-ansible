- name: configure backend server
  hosts: backend
  vars:
    login_password: ExpenseApp@1
    login_host: db.sundardev.online
  become: yes
  tasks:
  - name: disable older nodejs
    ansible.builtin.command: "dnf module disable nodejs -y"
  
  - name: enable new version nodejs
    ansible.builtin.command: "dnf module enable nodejs:20 -y"
  
  - name: install nodejs 
    ansible.builtin.dnf:
      name: {{ item }}
      state: installed
      loop:
      - nodejs
      - mysql

  - name: create expense user
    ansible.builtin.user:
      name: expense
  
  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory
        
  - name: download the code and unzip
    ansible.builtin.unarchive:
      src: https://expense-builds.s3.us-east-1.amazonaws.com/expense-backend-v2.zip
      dest: /app
      remote_src: yes
  - name: install nodejs dependencies
    ansible.builtin.command: npm install
    args:
      chdir: /app
  - name: copy the backend service
    ansible.builtin.copy:
      src: backend.service
      dest: /home/ec2-user/backend.service

  - name: install mysql python dependencies
    ansible.builtin.pip:
      name:
      - PyMySQL
      - cryptography
      executable: pip3.9
  
  - name: import data into mysql
    community.mysql.mysql_db:
      login_user: root
      login_password: "{{ login_password }}"
      login_host: "{{ login_host }}"
      target: /app/schema/backend.sql
      state: import
      name: all

  - name: system deamon reload
    ansible.builtin.systemd_service:
      daemon_reload: true

  - name: start and enable backend service
    ansible.builtin.service:
      name: backend
      state: started
      enabled: yes
