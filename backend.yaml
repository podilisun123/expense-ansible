- name: configure backend server
  hosts: backend
  become: yes
  tasks:
  - name: disable older nodejs
    ansible.builtin.command: dnf module disable nodejs -y
  
  - name: enable new version nodejs
    ansible.builtin.command: dnf module enable nodejs:20 -y
  
  - name: install nodejs 
    ansible.builtin.dnf:
    - name: nodejs
      state: installed
    
